[package]
name = "frieze"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Generate OpenAPI Schema Objects from Rust types via proc-macros."

[features]
default = ["inventory"]
# `inventory`-based collection (on by default). Enables
# `SchemasBuilder::from_inventory()` and turns the derive macro's
# `inventory_submit!` token into a real `inventory::submit!` site.
# Disable with `default-features = false` for no_std / WASM / embedded
# targets; without this feature the same derive expansion is a no-op
# submission and `from_inventory()` is not available.
inventory = ["dep:inventory"]
# `uuid::Uuid` field support (off by default). Enables the `Schema` /
# `Register` impls for `uuid::Uuid`, so a `#[derive(Schema)]` field of
# that type emits `{type: string, format: uuid}`. The name `Uuid` is
# reserved for the scalar whether or not this feature is on.
uuid1 = ["dep:uuid"]
# chrono date/time field support (off by default). Enables the
# `Schema` / `Register` impls for `chrono::DateTime<Utc>`,
# `chrono::DateTime<FixedOffset>`, `chrono::DateTime<Local>` and
# `chrono::NaiveDate`, so `#[derive(Schema)]` fields of those types emit
# `{type: string, format: date-time}` / `{type: string, format: date}`.
# The names `DateTime` and `Date` are reserved for those scalars whether
# or not this feature is on.
chrono04 = ["dep:chrono"]

[dependencies]
frieze-model.workspace = true
frieze-macros.workspace = true
inventory = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# `default-features = false` (inherited from the workspace entry) keeps
# chrono's `oldtime` / `wasmbind` defaults out of the graph — frieze
# only names the types, it never reads a clock. `clock` is the one
# default put back: `chrono::Local` lives behind it, and the impl set
# has to cover all three time zones chrono can deserialize (`Utc`,
# `FixedOffset`, `Local`) for "has a `Schema`" to mean "round-trips the
# wire". The feature only reaches the graph of a consumer that opted
# into `chrono04`, which depends on `chrono` itself anyway. chrono's
# `serde` support is a separate opt-in feature that nothing here
# enables; a consumer deriving `Serialize` / `Deserialize` turns it on
# through its own dependency entry.
chrono = { workspace = true, optional = true, features = ["clock"] }

# The internal dev-dependencies deliberately carry no `version`:
# version-less path dev-dependencies are stripped by `cargo publish`,
# so the published package does not depend on them being released.
[dev-dependencies]
frieze-openapi = { path = "../frieze-openapi" }
frieze-usecase = { path = "../../domain/frieze-usecase" }
insta.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
